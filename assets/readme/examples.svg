<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">模型哨兵实践示例</title>
  <desc id="desc">展示保持当前模型、建议更轻量模型和建议更强模型三种典型结果。</desc>
  <rect width="1200" height="590" rx="26" fill="#F8FAFC"/><rect x="1" y="1" width="1198" height="588" rx="25" fill="none" stroke="#CBD5E1"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <text x="58" y="58" font-size="34" font-weight="760" fill="#0F172A">它会在什么时候给出建议</text>
    <text x="58" y="88" font-size="17" fill="#64748B">具体结论来自当时上下文，不是任务类型映射。</text>
    <g transform="translate(58 128)"><rect width="338" height="392" rx="20" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="20" y="20" width="112" height="28" rx="14" fill="#E2E8F0"/><text x="76" y="39" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">保持当前模型</text><text x="20" y="84" font-size="15" font-weight="700" fill="#0F172A">本轮真实输入</text><text x="20" y="116" font-size="15" fill="#475569">统一上面三个标题的格式。</text><line x1="20" y1="145" x2="318" y2="145" stroke="#E2E8F0"/><text x="20" y="185" font-size="15" font-weight="700" fill="#64748B">判断结果</text><text x="20" y="222" font-size="21" font-weight="760" fill="#0F172A">直接执行任务</text><text x="20" y="258" font-size="14" fill="#64748B">操作简单且一次完成，</text><text x="20" y="282" font-size="14" fill="#64748B">切换收益有限。</text><rect x="20" y="322" width="298" height="48" rx="12" fill="#F1F5F9"/><text x="169" y="352" text-anchor="middle" font-size="14" fill="#64748B">无模型建议</text></g>
    <g transform="translate(431 128)"><rect width="338" height="392" rx="20" fill="#FFFFFF" stroke="#14B8A6"/><rect x="20" y="20" width="124" height="28" rx="14" fill="#ECFDF5"/><text x="82" y="39" text-anchor="middle" font-size="14" font-weight="700" fill="#0F766E">建议轻量模型</text><text x="20" y="84" font-size="15" font-weight="700" fill="#0F172A">本轮真实输入</text><text x="20" y="116" font-size="15" fill="#475569">继续处理剩余 30 条同类文案。</text><line x1="20" y1="145" x2="318" y2="145" stroke="#E2E8F0"/><text x="20" y="185" font-size="15" font-weight="700" fill="#0F766E">模型建议</text><text x="20" y="222" font-size="20" font-weight="760" fill="#0F172A">切换至 GPT-5.6 Luna</text><text x="20" y="258" font-size="14" fill="#64748B">任务重复、边界清晰，</text><text x="20" y="282" font-size="14" fill="#64748B">轻量模型更节省额度。</text><rect x="20" y="322" width="298" height="48" rx="12" fill="#ECFDF5"/><text x="169" y="352" text-anchor="middle" font-size="14" fill="#0F766E">用户手动选择是否切换</text></g>
    <g transform="translate(804 128)"><rect width="338" height="392" rx="20" fill="#0F172A"/><rect x="20" y="20" width="124" height="28" rx="14" fill="#134E4A"/><text x="82" y="39" text-anchor="middle" font-size="14" font-weight="700" fill="#99F6E4">建议更强模型</text><text x="20" y="84" font-size="15" font-weight="700" fill="#F8FAFC">本轮真实输入</text><text x="20" y="116" font-size="15" fill="#CBD5E1">设计支付、退款与异常补偿。</text><line x1="20" y1="145" x2="318" y2="145" stroke="#334155"/><text x="20" y="185" font-size="15" font-weight="700" fill="#5EEAD4">模型建议</text><text x="20" y="222" font-size="20" font-weight="760" fill="#F8FAFC">切换至 GPT-5.6 Sol</text><text x="20" y="258" font-size="14" fill="#94A3B8">任务跨系统且影响较高，</text><text x="20" y="282" font-size="14" fill="#94A3B8">需要整合多项约束。</text><rect x="20" y="322" width="298" height="48" rx="12" fill="#10272A"/><text x="169" y="352" text-anchor="middle" font-size="14" fill="#99F6E4">用户手动选择是否切换</text></g>
  </g>
</svg>
