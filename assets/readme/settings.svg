<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">模型哨兵设置结构</title>
  <desc id="desc">模型哨兵的设置分为全局默认和当前任务两层：默认关闭自动启用，当前任务可以启用、关闭或暂停；运行反馈不改变模型判断流程。</desc>
  <rect width="1200" height="560" rx="26" fill="#101827"/>
  <rect x="1" y="1" width="1198" height="558" rx="25" fill="none" stroke="#34435B"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <text x="58" y="62" font-size="36" font-weight="780" fill="#F8FAFC">设置只管理开关，不替你做模型选择</text>
    <text x="58" y="94" font-size="18" fill="#9AA9BD">默认按任务关闭；需要时开启当前对话，不需要时暂停或关闭。</text>
    <g transform="translate(58 137)">
      <rect width="520" height="326" rx="20" fill="#172235" stroke="#364862"/>
      <text x="28" y="43" font-size="14" font-weight="750" letter-spacing="1.5" fill="#69E7D0">全局默认</text>
      <text x="28" y="81" font-size="24" font-weight="780" fill="#F8FAFC">控制新任务的起点</text>
      <g transform="translate(28 113)">
        <rect width="464" height="76" rx="14" fill="#101827" stroke="#2E3E57"/>
        <text x="20" y="32" font-size="17" font-weight="700" fill="#F8FAFC">新任务自动启用</text>
        <text x="20" y="57" font-size="15" fill="#9AA9BD">默认关闭；开启后首条真实请求开始判断</text>
        <rect x="402" y="23" width="40" height="22" rx="11" fill="#334155"/><circle cx="413" cy="34" r="8" fill="#E8EEF6"/>
      </g>
      <g transform="translate(28 207)">
        <rect width="464" height="76" rx="14" fill="#101827" stroke="#2E3E57"/>
        <text x="20" y="32" font-size="17" font-weight="700" fill="#F8FAFC">运行反馈</text>
        <text x="20" y="57" font-size="15" fill="#9AA9BD">可选；只影响提示，不改变判断与续跑</text>
      </g>
    </g>
    <g transform="translate(622 137)">
      <rect width="520" height="326" rx="20" fill="#172235" stroke="#364862"/>
      <text x="28" y="43" font-size="14" font-weight="750" letter-spacing="1.5" fill="#8E9BFF">当前任务</text>
      <text x="28" y="81" font-size="24" font-weight="780" fill="#F8FAFC">只作用于正在对话的任务</text>
      <g transform="translate(28 113)">
        <rect width="464" height="76" rx="14" fill="#101827" stroke="#2E3E57"/>
        <text x="20" y="32" font-size="17" font-weight="700" fill="#F8FAFC">启用 / 关闭</text>
        <text x="20" y="57" font-size="15" fill="#9AA9BD">决定该任务是否进入模型建议流程</text>
        <rect x="402" y="23" width="40" height="22" rx="11" fill="#6D7CFF"/><circle cx="431" cy="34" r="8" fill="#FFFFFF"/>
      </g>
      <g transform="translate(28 207)">
        <rect width="464" height="76" rx="14" fill="#101827" stroke="#2E3E57"/>
        <text x="20" y="32" font-size="17" font-weight="700" fill="#F8FAFC">暂停判断</text>
        <text x="20" y="57" font-size="15" fill="#9AA9BD">暂停期间主任务照常执行，不进行建议</text>
      </g>
    </g>
    <text x="58" y="516" font-size="16" fill="#9AA9BD">设置页需要精确任务 ID 才会修改当前任务；缺失时只允许保存全局默认，避免多任务串写。</text>
  </g>
</svg>
