<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">模型哨兵</title>
  <desc id="desc">一个按任务启用的 Codex 模型建议插件：当前主模型先做内部判断，合适时继续，需要切换时暂停并交给用户选择。</desc>
  <rect width="1200" height="380" rx="28" fill="#0B1220"/>
  <path d="M64 68H1136M64 312H1136" stroke="#233047" stroke-width="1"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <g transform="translate(64 70)">
      <text y="18" font-size="15" font-weight="700" letter-spacing="2" fill="#69E7D0">CODEX · 按任务模型建议</text>
      <text y="101" font-size="70" font-weight="780" fill="#F8FAFC">模型哨兵</text>
      <text y="147" font-size="25" fill="#D3DCEB">先理解连续对话，再决定是否值得切换模型</text>
      <text y="186" font-size="18" fill="#9AA9BD">默认关闭 · 不自动切换 · 只在需要时暂停任务</text>
      <g transform="translate(0 220)">
        <rect width="144" height="40" rx="12" fill="#131E31" stroke="#31415C"/>
        <text x="72" y="26" text-anchor="middle" font-size="15" font-weight="650" fill="#D3DCEB">当前主模型判断</text>
        <rect x="158" width="146" height="40" rx="12" fill="#131E31" stroke="#31415C"/>
        <text x="231" y="26" text-anchor="middle" font-size="15" font-weight="650" fill="#D3DCEB">用户手动选择</text>
      </g>
    </g>
    <g transform="translate(738 62)">
      <rect width="398" height="256" rx="20" fill="#101A2B" stroke="#31415C"/>
      <text x="28" y="37" font-size="14" font-weight="700" letter-spacing="1.4" fill="#9AA9BD">一次请求的决策分流</text>
      <path d="M48 93H148" stroke="#6D7CFF" stroke-width="3"/>
      <circle cx="170" cy="93" r="22" fill="#17233A" stroke="#69E7D0" stroke-width="2"/>
      <path d="M160 84l18 9-18 9z" fill="#69E7D0"/>
      <path d="M192 93H350" stroke="#69E7D0" stroke-width="3"/>
      <path d="M170 115V180H350" stroke="#6D7CFF" stroke-width="3" fill="none"/>
      <rect x="28" y="69" width="118" height="48" rx="12" fill="#17233A"/>
      <text x="87" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#F8FAFC">真实请求</text>
      <rect x="260" y="69" width="112" height="48" rx="12" fill="#143238" stroke="#2D8578"/>
      <text x="316" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#B9F7EA">直接执行</text>
      <rect x="260" y="156" width="112" height="48" rx="12" fill="#24213A" stroke="#6D7CFF"/>
      <text x="316" y="185" text-anchor="middle" font-size="16" font-weight="700" fill="#DFE3FF">展示建议</text>
      <text x="48" y="232" font-size="15" fill="#9AA9BD">合适：继续任务　·　值得切换：由你决定</text>
    </g>
  </g>
</svg>
