<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">模型哨兵前置评估工作流</title>
  <desc id="desc">本轮真实输入进入当前模型后先完成同会话判断；保持时执行主任务，需要切换时暂停并提示，用户选择模型后原样重发。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#64748B"/></marker></defs>
  <rect width="1200" height="620" rx="26" fill="#F8FAFC"/><rect x="1" y="1" width="1198" height="618" rx="25" fill="none" stroke="#CBD5E1"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <text x="58" y="58" font-size="34" font-weight="760" fill="#0F172A">一条请求如何通过模型哨兵</text>
    <text x="58" y="88" font-size="17" fill="#64748B">当前对话模型先判断；这是逻辑拦截，不是模型调用前的硬阻断。</text>
    <g transform="translate(58 128)">
      <rect width="184" height="116" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/><circle cx="28" cy="28" r="13" fill="#E2E8F0"/><text x="28" y="33" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">1</text><text x="22" y="69" font-size="18" font-weight="700" fill="#0F172A">用户发送请求</text><text x="22" y="94" font-size="14" fill="#64748B">保留本轮原始输入</text>
      <path d="M196 58H228" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
      <g transform="translate(240)"><rect width="224" height="116" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/><circle cx="28" cy="28" r="13" fill="#E2E8F0"/><text x="28" y="33" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">2</text><text x="22" y="69" font-size="18" font-weight="700" fill="#0F172A">Hook 组织证据</text><text x="22" y="94" font-size="14" fill="#64748B">模型 · 历史 · 配置</text></g>
      <path d="M476 58H508" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
      <g transform="translate(520)"><rect width="250" height="116" rx="18" fill="#ECFDF5" stroke="#14B8A6"/><circle cx="28" cy="28" r="13" fill="#99F6E4"/><text x="28" y="33" text-anchor="middle" font-size="13" font-weight="700" fill="#115E59">3</text><text x="22" y="69" font-size="18" font-weight="700" fill="#115E59">推荐引擎判断</text><text x="22" y="94" font-size="14" fill="#0F766E">模型原生判断，不做映射</text></g>
      <path d="M782 58H814" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
      <g transform="translate(826)"><rect width="258" height="116" rx="18" fill="#0F172A"/><circle cx="28" cy="28" r="13" fill="#134E4A"/><text x="28" y="33" text-anchor="middle" font-size="13" font-weight="700" fill="#99F6E4">4</text><text x="22" y="69" font-size="18" font-weight="700" fill="#F8FAFC">输出判断结果</text><text x="22" y="94" font-size="14" fill="#94A3B8">stay / change / 放行</text></g>
    </g>
    <g transform="translate(58 286)">
      <rect width="1084" height="220" rx="20" fill="#FFFFFF" stroke="#CBD5E1"/>
      <g transform="translate(28 28)"><rect width="492" height="164" rx="16" fill="#F1F5F9"/><rect width="8" height="164" rx="4" fill="#64748B"/><text x="28" y="38" font-size="16" font-weight="700" fill="#334155">当前模型合适 / 判断失败</text><text x="28" y="72" font-size="23" font-weight="760" fill="#0F172A">直接执行主任务</text><text x="28" y="107" font-size="14" fill="#64748B">没有模型建议；失败也不拦住工作。</text><text x="28" y="136" font-size="14" fill="#0F766E">可选在普通回复末尾显示 🛰️</text></g>
      <g transform="translate(564 28)"><rect width="492" height="164" rx="16" fill="#ECFDF5" stroke="#14B8A6"/><rect width="8" height="164" rx="4" fill="#14B8A6"/><text x="28" y="38" font-size="16" font-weight="700" fill="#0F766E">推荐模型发生变化</text><text x="28" y="72" font-size="23" font-weight="760" fill="#115E59">先显示两行建议</text><text x="28" y="107" font-size="14" fill="#0F766E">用户切换或保持模型，再发送同一请求。</text><text x="28" y="136" font-size="14" fill="#64748B">请求指纹命中后直接执行，不重复评估。</text></g>
    </g>
    <g transform="translate(58 532)"><rect width="1084" height="54" rx="15" fill="#0F172A"/><text x="24" y="34" font-size="15" font-weight="700" fill="#5EEAD4">共同原则</text><text x="118" y="34" font-size="15" fill="#E2E8F0">不自动切模型 · 不保存任务正文 · 不修改主请求 · 评估失败时放行</text></g>
  </g>
</svg>
